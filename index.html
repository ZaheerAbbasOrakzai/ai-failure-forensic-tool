    <style>
      html, body, #root {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      html, body {
        background-color: #09090b !important;
        color: #fafafa;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      * {
        scrollbar-width: thin;
        scrollbar-color: rgba(75, 85, 99, 0.4) transparent;
      }
      *::-webkit-scrollbar {
        width: 5px;
        height: 5px;
      }
      *::-webkit-scrollbar-track {
        background: transparent;
      }
      *::-webkit-scrollbar-thumb {
        background-color: rgba(75, 85, 99, 0.4);
        border-radius: 10px;
      }
      #root:empty {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        background: 
          radial-gradient(ellipse at top, rgba(249, 115, 22, 0.08) 0%, transparent 50%),
          radial-gradient(ellipse at bottom, rgba(59, 130, 246, 0.05) 0%, transparent 50%),
          #09090b;
        position: relative;
        overflow: hidden;
      }
      #root:empty::before {
        content: '';
        position: absolute;
        inset: 0;
        background-image: 
          linear-gradient(rgba(63, 63, 70, 0.08) 1px, transparent 1px),
          linear-gradient(90deg, rgba(63, 63, 70, 0.08) 1px, transparent 1px);
        background-size: 28px 28px;
        animation: gridFloat 20s linear infinite;
      }
      @keyframes gridFloat {
        0% { background-position: 0 0; }
        100% { background-position: 28px 28px; }
      }
      #root:empty::after {
        content: '';
        width: 44px;
        height: 44px;
        border: 3px solid rgba(249, 115, 22, 0.15);
        border-top-color: #f97316;
        border-radius: 14px;
        animation: spinScale 0.9s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        box-shadow: 0 0 40px rgba(249, 115, 22, 0.15), 0 0 80px rgba(249, 115, 22, 0.05);
        position: relative;
        z-index: 10;
      }
      @keyframes spinScale {
        0% { transform: rotate(0deg) scale(0.95); }
        50% { transform: rotate(180deg) scale(1.05); }
        100% { transform: rotate(360deg) scale(0.95); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.6; }
        50% { opacity: 1; }
      }
    </style>
    <script>
      (function () {
        if (window.self === window.top) return;
        var reported = {};
        window.addEventListener("error", function (event) {
          if (!event || !event.message) return;
          var key = event.message + "|" + (event.filename || "") + "|" + (event.lineno || 0);
          if (reported[key]) return;
          reported[key] = true;
          try {
            window.parent.postMessage({
              type: "sandbox-runtime-error",
              payload: {
                message: String(event.message).slice(0, 500),
                filename: event.filename || "",
                lineno: event.lineno || 0,
                colno: event.colno || 0,
                stack: event.error && event.error.stack ? String(event.error.stack).slice(0, 2000) : ""
              }
            }, "*");
          } catch (e) {}
        });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
