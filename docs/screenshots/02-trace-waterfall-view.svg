        <text x="200" y="0" font-family="JetBrains Mono, monospace" font-size="15" font-weight="700" fill="#f97316">3.82 s</text>
      </g>
      <g transform="translate(0,280)">
        <text x="0" y="0" fill="#71717a">Total Tokens</text>
        <text x="200" y="0" font-family="JetBrains Mono, monospace" font-size="13" fill="#d4d4d8">12,480  (input 9,140 / output 3,340)</text>
