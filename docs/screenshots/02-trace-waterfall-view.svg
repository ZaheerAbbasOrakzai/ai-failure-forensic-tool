        <text x="180" y="20" text-anchor="end" fill="#52525b" font-family="JetBrains Mono, monospace" font-size="10">0.61s</text>
        <rect x="752" y="8" width="102" height="18" rx="5" fill="url(#spError)" fill-opacity="0.65"/>
      </g>
      <!-- row 9 eval guard -->
