  <rect x="1250" y="16" width="130" height="28" rx="14" fill="#450a0a" stroke="#ef4444" stroke-opacity="0.3"/>
  <text x="1315" y="35" font-family="Inter, Arial, sans-serif" font-size="11" fill="#fca5a5" font-weight="700" text-anchor="middle">● TRACE FAILED</text>

