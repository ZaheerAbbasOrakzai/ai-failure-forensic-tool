        <text x="180" y="20" text-anchor="end" fill="#f97316" font-family="JetBrains Mono, monospace" font-size="10">1.26s</text>
        <rect x="375" y="8" width="218" height="18" rx="5" fill="url(#spWarning)" fill-opacity="0.85"/>
