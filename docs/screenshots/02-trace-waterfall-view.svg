        <text x="180" y="20" text-anchor="end" fill="#52525b" font-family="JetBrains Mono, monospace" font-size="10">0.83s</text>
        <rect x="605" y="8" width="143" height="18" rx="5" fill="url(#spError)" fill-opacity="0.65"/>
      </g>
      <g transform="translate(0,320)">
