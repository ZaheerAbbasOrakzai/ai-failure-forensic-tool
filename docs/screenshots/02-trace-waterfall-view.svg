        <rect x="0" y="0" width="974" height="34" fill="#1c1917" stroke="#3f3f46" stroke-opacity="0.5"/>
        <text x="14" y="22" font-size="11" fill="#71717a" font-weight="600">SPAN METADATA  ·  tool.enrich_transaction</text>
        <text x="900" y="22" text-anchor="end" font-size="10" fill="#52525b" font-family="JetBrains Mono, monospace">application/json  ·  2.3 KB</text>

        <g font-family="JetBrains Mono, Consolas, monospace" font-size="11.5">
          <text x="16" y="62" fill="#d4d4d8">{</text>
          <text x="32" y="82" fill="#fb923c">"service"</text><text x="118" y="82" fill="#d4d4d8">: </text><text x="128" y="82" fill="#86efac">"fraud-tx-enrich-v2"</text><text x="328" y="82" fill="#d4d4d8">,</text>
          <text x="32" y="102" fill="#fb923c">"http_status"</text><text x="134" y="102" fill="#d4d4d8">: </text><text x="144" y="102" fill="#fca5a5" font-weight="700">503</text><text x="174" y="102" fill="#d4d4d8">,</text>
          <text x="32" y="122" fill="#fb923c">"error_code"</text><text x="134" y="122" fill="#d4d4d8">: </text><text x="144" y="122" fill="#86efac">"DB_POOL_EXHAUSTED"</text><text x="316" y="122" fill="#d4d4d8">,</text>
          <text x="32" y="142" fill="#fb923c">"retries"</text><text x="106" y="142" fill="#d4d4d8">: </text><text x="116" y="142" fill="#facc15">2</text><text x="126" y="142" fill="#d4d4d8">,</text>
          <text x="32" y="162" fill="#fb923c">"max_retries"</text><text x="128" y="162" fill="#d4d4d8">: </text><text x="138" y="162" fill="#facc15">3</text><text x="148" y="162" fill="#d4d4d8">,</text>
          <text x="32" y="182" fill="#fb923c">"customer_id"</text><text x="136" y="182" fill="#d4d4d8">: </text><text x="146" y="182" fill="#86efac">"cust_9f3…441b"</text>
          <text x="16" y="202" fill="#d4d4d8">}</text>
        </g>
