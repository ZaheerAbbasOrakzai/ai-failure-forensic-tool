        <text x="180" y="20" text-anchor="end" fill="#52525b" font-family="JetBrains Mono, monospace" font-size="10">0.12s</text>
        <rect x="820" y="8" width="22" height="18" rx="5" fill="url(#spSuccess)" fill-opacity="0.7"/>
