        <line x1="0" y1="120" x2="700" y2="120" stroke="#3f3f46" stroke-opacity="0.3"/>
        <line x1="0" y1="160" x2="700" y2="160" stroke="#3f3f46" stroke-opacity="0.5"/>

        <!-- P95 area -->
