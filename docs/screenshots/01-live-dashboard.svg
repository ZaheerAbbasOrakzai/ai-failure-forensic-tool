          <rect x="568" y="20" width="110" height="26" rx="13" fill="#eab308" fill-opacity="0.14" stroke="#eab308" stroke-opacity="0.35"/>
          <text x="623" y="37" font-size="11" font-weight="700" fill="#facc15" text-anchor="middle">WARNING</text>
        </g>
      </g>
