<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#09090b"/>
      <stop offset="100%" stop-color="#18181b"/>
    </linearGradient>
    <radialGradient id="gl1" cx="0.2" cy="0.2" r="0.5">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#f97316" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="card1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#27272a"/>
      <stop offset="100%" stop-color="#1c1c1f"/>
    </linearGradient>
    <linearGradient id="area1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#f97316" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="area2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg1)"/>
  <rect width="1600" height="900" fill="url(#gl1)"/>

  <!-- Top bar -->
  <rect x="0" y="0" width="1600" height="60" fill="#09090b" stroke="#27272a"/>
  <rect x="30" y="18" width="180" height="24" rx="12" fill="#18181b"/>
  <circle cx="48" cy="30" r="7" fill="#ef4444">
    <animate attributeName="r" values="5;9;5" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <text x="64" y="35" font-family="Inter, Arial, sans-serif" font-size="12" fill="#fca5a5" font-weight="700" letter-spacing="2">LIVE</text>
  <text x="250" y="38" font-family="Inter, Arial, sans-serif" font-size="14" fill="#a1a1aa">Home / Monitor / <tspan fill="#f4f4f5" font-weight="600">Live Dashboard</tspan></text>
  <rect x="1370" y="16" width="180" height="28" rx="7" fill="#27272a" stroke="#3f3f46"/>
  <text x="1386" y="35" font-family="Inter, Arial, sans-serif" font-size="12" fill="#a1a1aa">⌘K  Search...</text>

  <!-- 4 Stat cards -->
  <g transform="translate(30,90)" font-family="Inter, Arial, sans-serif">
    <rect width="370" height="120" rx="14" fill="url(#card1)" stroke="#3f3f46"/>
    <circle cx="320" cy="40" r="22" fill="#f97316" fill-opacity="0.15"/>
    <text x="28" y="40" font-size="11" fill="#71717a" font-weight="600" letter-spacing="1">TRACES / MIN</text>
    <text x="28" y="82" font-size="40" fill="#fafafa" font-weight="800">1,284</text>
    <rect x="28" y="95" width="80" height="20" rx="10" fill="#064e3b"/>
    <text x="42" y="109" font-size="11" fill="#6ee7b7" font-weight="700">▲ 12.4%</text>

    <rect x="390" width="370" height="120" rx="14" fill="url(#card1)" stroke="#3f3f46"/>
    <circle cx="710" cy="40" r="22" fill="#3b82f6" fill-opacity="0.15"/>
    <text x="418" y="40" font-size="11" fill="#71717a" font-weight="600" letter-spacing="1">P95 LATENCY</text>
    <text x="418" y="82" font-size="40" fill="#fafafa" font-weight="800">2.83<tspan font-size="22" fill="#71717a">s</tspan></text>
    <rect x="418" y="95" width="80" height="20" rx="10" fill="#052e16"/>
    <text x="432" y="109" font-size="11" fill="#86efac" font-weight="700">▼ 4.1%</text>

    <rect x="780" width="370" height="120" rx="14" fill="url(#card1)" stroke="#3f3f46"/>
    <circle cx="1100" cy="40" r="22" fill="#ef4444" fill-opacity="0.15"/>
    <text x="808" y="40" font-size="11" fill="#71717a" font-weight="600" letter-spacing="1">FAILURE RATE</text>
    <text x="808" y="82" font-size="40" fill="#fafafa" font-weight="800">3.42<tspan font-size="22" fill="#71717a">%</tspan></text>
    <rect x="808" y="95" width="80" height="20" rx="10" fill="#450a0a"/>
    <text x="822" y="109" font-size="11" fill="#fca5a5" font-weight="700">▲ 1.8%</text>

