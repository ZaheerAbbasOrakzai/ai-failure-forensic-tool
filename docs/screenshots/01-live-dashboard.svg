          <circle cx="30" cy="35" r="10" fill="#713f12"/>
          <text x="24" y="39" font-size="14" text-anchor="middle" fill="#fde047" font-weight="800">W</text>
          <text x="54" y="26" font-size="13" fill="#fafafa" font-weight="700">Warning: High review backlog in Eval Dataset</text>
